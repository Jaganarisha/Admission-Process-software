# /etc/nginx/conf.d/bec.conf  (EC2 single-server option; or let CloudFront route /api/* to the API origin instead)
server {
  listen 80;
  server_name _;
  root /var/www/bec;            # contents of frontend/dist
  index index.html;
  client_max_body_size 3m;      # documents are limited to 2 MB

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }   # React Router
}
